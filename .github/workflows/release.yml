name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag da release (ex.: v0.1.0). Precisa ser igual à version do package.json com prefixo v.'
        required: true
        type: string
      prerelease:
        description: 'Marcar como pré-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida: '$VERSION'. Use o formato v0.1.0 ou v0.1.0-beta.1." >&2
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "v$PKG_VERSION" ]]; then
            echo "A tag '$VERSION' não corresponde à version '$PKG_VERSION' do package.json." >&2
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "A tag '$VERSION' já existe no repositório. Releases não são sobrescritas." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate mobile bundle
        run: npm run export:ios -w @asrv/mobile

      - name: Build web app
        run: npm run build -w @asrv/frontend

      - name: Build Storybook
        run: npm run build-storybook -w @asrv/design-system

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager não encontrado (ANDROID_HOME=${ANDROID_HOME:-<vazio>})" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          mkdir -p release
          (cd frontend/dist && zip -qr "$GITHUB_WORKSPACE/release/asrv-web-${VERSION}.zip" .)
          (cd packages/design-system/storybook-static && zip -qr "$GITHUB_WORKSPACE/release/asrv-storybook-${VERSION}.zip" .)

          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_SRC" ]]; then
            echo "APK não encontrado em $APK_SRC" >&2
            exit 1
          fi
          cp "$APK_SRC" "release/asrv-mobile-${VERSION}.apk"

          (cd release && sha256sum asrv-web-*.zip asrv-storybook-*.zip asrv-mobile-*.apk > SHA256SUMS)

          ls -lh release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          flags=(--target "$GITHUB_SHA" --title "Diário Trader ASRV $VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$VERSION" \
            release/asrv-web-*.zip \
            release/asrv-storybook-*.zip \
            release/asrv-mobile-*.apk \
            release/SHA256SUMS \
            "${flags[@]}"

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Release $VERSION publicada"
            echo
            echo "- Web: \`asrv-web-${VERSION}.zip\`"
            echo "- Storybook: \`asrv-storybook-${VERSION}.zip\`"
            echo "- Mobile (APK Android): \`asrv-mobile-${VERSION}.apk\`"
            echo "- Checksums: \`SHA256SUMS\`"
            echo
            echo "Assets disponíveis na aba Releases do GitHub."
            echo
            echo "> O APK é universal, variante release, assinado com a debug keystore do Expo/RN."
            echo "> Serve para instalação direta e testes; para publicar na Play Store é preciso um"
            echo "> keystore de produção ou credenciais EAS."
          } >> "$GITHUB_STEP_SUMMARY"
